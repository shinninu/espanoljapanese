<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>スペイン語フラッシュカード</title>
<style>
  :root {
    --bg: #1A2340;
    --bg-panel: #222d4d;
    --card-front: #F0EDE4;
    --card-back: #e8e0d0;
    --accent: #C8923A;
    --accent-light: #dba854;
    --text-dark: #2a1f0e;
    --text-light: #E8E4DC;
    --text-muted: #8e9bb5;
    --success: #5a9e6f;
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text-light);
    font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
    user-select: none;
  }

  /* ── Header ── */
  header {
    width: 100%;
    max-width: 480px;
    padding: 20px 20px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .app-title {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
  }

  .manage-btn {
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .manage-btn:hover { background: var(--accent); color: #fff; }

  /* ── Theme Tabs ── */
  .theme-tabs {
    width: 100%;
    max-width: 480px;
    padding: 0 20px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 4px;
  }
  .theme-tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    border: none;
    background: var(--bg-panel);
    color: var(--text-muted);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab.active {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  /* ── Progress ── */
  .progress-area {
    width: 100%;
    max-width: 480px;
    padding: 14px 20px 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress-bar-bg {
    flex: 1;
    height: 4px;
    background: var(--bg-panel);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .progress-text {
    font-size: 12px;
    color: var(--text-muted);
    min-width: 48px;
    text-align: right;
  }

  /* ── Card Scene ── */
  .card-scene {
    width: 100%;
    max-width: 480px;
    padding: 10px 20px 0;
    perspective: 1200px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-wrapper {
    width: 100%;
    max-width: 440px;
    aspect-ratio: 3/2;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .card-wrapper.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }

  .card-front {
    background: var(--card-front);
    color: var(--text-dark);
  }
  .card-back {
    background: var(--card-back);
    color: var(--text-dark);
    transform: rotateY(180deg);
  }

  .card-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 12px;
  }

  .card-main {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: clamp(22px, 6vw, 32px);
    font-weight: 400;
    color: #1a1208;
    text-align: center;
    line-height: 1.35;
    letter-spacing: 0.01em;
  }

  .card-sub {
    margin-top: 10px;
    font-size: 12px;
    color: #7a6b52;
    text-align: center;
    font-style: italic;
  }

  .card-hint {
    position: absolute;
    bottom: 14px;
    font-size: 11px;
    color: #b0a090;
    letter-spacing: 0.05em;
  }

  /* ── Answer Buttons ── */
  .answer-btns {
    width: 100%;
    max-width: 480px;
    padding: 16px 20px;
    display: flex;
    gap: 12px;
  }
  .answer-btns.hidden { opacity: 0; pointer-events: none; }

  .btn-forgot, .btn-knew {
    flex: 1;
    padding: 14px;
    border-radius: var(--radius);
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-forgot:active, .btn-knew:active { transform: scale(0.96); }

  .btn-forgot {
    background: var(--bg-panel);
    color: #e07a7a;
    border: 1px solid #e07a7a44;
  }
  .btn-knew {
    background: var(--success);
    color: #fff;
  }

  /* ── Nav ── */
  .nav-area {
    width: 100%;
    max-width: 480px;
    padding: 4px 20px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--bg-panel);
    color: var(--text-light);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .nav-btn:hover { background: #2e3d66; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  .card-counter {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* ── Complete Banner ── */
  .complete-banner {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 40px 20px;
    text-align: center;
  }
  .complete-banner.show { display: flex; }

  .complete-emoji { font-size: 52px; }
  .complete-title { font-size: 22px; font-weight: 700; color: var(--accent); }
  .complete-sub { font-size: 14px; color: var(--text-muted); line-height: 1.6; }
  .restart-btn {
    margin-top: 8px;
    padding: 12px 28px;
    border-radius: 24px;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  /* ── Export Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    background: #1e2b4a;
    width: 100%;
    max-width: 480px;
    border-radius: 24px 24px 0 0;
    padding: 20px 20px 40px;
    max-height: 85vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: #4a5a80;
    border-radius: 4px;
    margin: 0 auto 20px;
  }

  .modal-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--text-light);
  }

  .export-option {
    background: var(--bg);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 10px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: border-color 0.2s, background 0.2s;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .export-option:hover { border-color: var(--accent); background: #1e2b4a; }

  .export-icon { font-size: 28px; flex-shrink: 0; }

  .export-texts { flex: 1; }
  .export-label { font-size: 15px; font-weight: 600; color: var(--text-light); }
  .export-desc { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }

  .export-arrow { color: var(--accent); font-size: 18px; }

  .export-scope {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .scope-btn {
    flex: 1;
    padding: 9px;
    border-radius: 10px;
    border: 1px solid #3a4d70;
    background: var(--bg);
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .scope-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(200,146,58,0.1);
    font-weight: 600;
  }

  .export-note {
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    margin-top: 12px;
    line-height: 1.6;
  }

  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--success);
    color: #fff;
    padding: 10px 22px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .modal-close {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    border-radius: 12px;
    background: var(--bg);
    color: var(--text-muted);
    border: none;
    font-size: 14px;
    cursor: pointer;
  }

  /* Learned badge */
  .learned-badge {
    position: absolute;
    top: 14px;
    right: 14px;
    background: var(--success);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    letter-spacing: 0.05em;
  }

  @media (prefers-reduced-motion: reduce) {
    .card-wrapper { transition: none; }
    @keyframes slideUp { from { transform: none; } }
  }
</style>
</head>
<body>

<header>
  <span class="app-title">🇪🇸 スペイン語カード</span>
  <button class="manage-btn" onclick="openModal()">📤 データ出力</button>
</header>

<div class="theme-tabs" id="themeTabs"></div>

<div class="progress-area">
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="progress-text" id="progressText">0 / 0</div>
</div>

<div class="card-scene" id="cardScene">
  <div class="card-wrapper" id="cardWrapper" onclick="flipCard()">
    <div class="card-face card-front" id="cardFront">
      <span class="card-label">Español</span>
      <div class="card-main" id="cardES"></div>
      <div class="card-sub" id="cardNote"></div>
      <span class="card-hint">タップしてめくる</span>
    </div>
    <div class="card-face card-back" id="cardBack">
      <span class="card-label">日本語</span>
      <div class="card-main" id="cardJA" style="font-family: inherit; font-size: clamp(18px,5vw,26px);"></div>
      <span class="card-hint">タップして戻す</span>
    </div>
  </div>
</div>

<div class="complete-banner" id="completeBanner">
  <div class="complete-emoji">🎉</div>
  <div class="complete-title">テーマ完了！</div>
  <div class="complete-sub" id="completeStats"></div>
  <button class="restart-btn" onclick="restartTheme()">もう一度練習する</button>
</div>

<div class="answer-btns" id="answerBtns">
  <button class="btn-forgot" onclick="markCard(false)">× 覚えてない</button>
  <button class="btn-knew" onclick="markCard(true)">✓ 覚えた！</button>
</div>

<div class="nav-area">
  <button class="nav-btn" id="prevBtn" onclick="prevCard()">‹</button>
  <span class="card-counter" id="cardCounter"></span>
  <button class="nav-btn" id="nextBtn" onclick="nextCard()">›</button>
</div>

<!-- Export Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">📤 データ出力</div>

    <div class="export-scope">
      <button class="scope-btn active" id="scopeAll" onclick="setScope('all')">全テーマ</button>
      <button class="scope-btn" id="scopeCurrent" onclick="setScope('current')">現在のテーマのみ</button>
    </div>

    <div class="export-option" onclick="exportCSV()">
      <div class="export-icon">📊</div>
      <div class="export-texts">
        <div class="export-label">CSV出力（スプレッドシート用）</div>
        <div class="export-desc">Google スプレッドシートやExcelにインポート可能。テーマ・スペイン語・日本語・補足・学習状況を含む。</div>
      </div>
      <div class="export-arrow">›</div>
    </div>

    <div class="export-option" onclick="exportJSON()">
      <div class="export-icon">🗂️</div>
      <div class="export-texts">
        <div class="export-label">JSON出力（開発者向け）</div>
        <div class="export-desc">将来のスプレッドシート連携実装時のデータ確認や、バックアップとして使用可能。</div>
      </div>
      <div class="export-arrow">›</div>
    </div>

    <p class="export-note">
      💡 将来はスプレッドシートからカードを読み込み、<br>学習状況を自動で書き戻す予定です。
    </p>

    <button class="modal-close" onclick="closeModal()">閉じる</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══ DATA ══
let themes = [
  {
    id: 0,
    name: "📅 日付の予定",
    cards: [
      { es: "enero", ja: "1月", note: "" },
      { es: "febrero", ja: "2月", note: "" },
      { es: "marzo", ja: "3月", note: "" },
      { es: "abril", ja: "4月", note: "" },
      { es: "mayo", ja: "5月", note: "" },
      { es: "junio", ja: "6月", note: "" },
      { es: "julio", ja: "7月", note: "" },
      { es: "agosto", ja: "8月", note: "" },
      { es: "septiembre", ja: "9月", note: "" },
      { es: "octubre", ja: "10月", note: "" },
      { es: "noviembre", ja: "11月", note: "" },
      { es: "diciembre", ja: "12月", note: "" },
      { es: "lunes", ja: "月曜日", note: "" },
      { es: "martes", ja: "火曜日", note: "" },
      { es: "miércoles", ja: "水曜日", note: "" },
      { es: "jueves", ja: "木曜日", note: "" },
      { es: "viernes", ja: "金曜日", note: "" },
      { es: "sábado", ja: "土曜日", note: "" },
      { es: "domingo", ja: "日曜日", note: "" },
      { es: "¿Cuándo vas a hacerlo?", ja: "いつそれをしますか？", note: "" },
      { es: "El martes voy al gimnasio.", ja: "火曜日にジムに行きます。", note: "" },
      { es: "Tengo una cita el 3 de mayo.", ja: "5月3日に予約があります。", note: "" },
      { es: "¿Qué día es hoy?", ja: "今日は何曜日ですか？", note: "" },
      { es: "Hoy es miércoles.", ja: "今日は水曜日です。", note: "" },
    ]
  },
  {
    id: 1,
    name: "⏰ 時間",
    cards: [
      { es: "la hora", ja: "時間／時刻", note: "" },
      { es: "el minuto", ja: "分", note: "" },
      { es: "el segundo", ja: "秒", note: "" },
      { es: "la mañana", ja: "午前・朝", note: "" },
      { es: "la tarde", ja: "午後", note: "" },
      { es: "la noche", ja: "夜", note: "" },
      { es: "el mediodía", ja: "正午", note: "" },
      { es: "la medianoche", ja: "深夜0時", note: "" },
      { es: "¿Qué hora es?", ja: "何時ですか？", note: "" },
      { es: "Son las tres.", ja: "3時です。", note: "" },
      { es: "A las ocho voy al trabajo.", ja: "8時に仕事に行きます。", note: "" },
      { es: "¿A qué hora empieza?", ja: "何時に始まりますか？", note: "" },
      { es: "En diez minutos llega el tren.", ja: "あと10分で電車が来ます。", note: "" },
      { es: "Faltan cinco minutos para las nueve.", ja: "9時まであと5分です。", note: "" },
      { es: "¿Cuándo te despiertas?", ja: "いつ起きますか？", note: "" },
    ]
  },
  {
    id: 2,
    name: "🌅 1日の行動",
    cards: [
      { es: "despertarse", ja: "目を覚ます", note: "再帰動詞" },
      { es: "levantarse", ja: "起き上がる・起床する", note: "再帰動詞" },
      { es: "lavarse la cara", ja: "顔を洗う", note: "" },
      { es: "cepillarse los dientes", ja: "歯を磨く", note: "" },
      { es: "ducharse", ja: "シャワーを浴びる", note: "再帰動詞" },
      { es: "vestirse", ja: "服を着替える", note: "再帰動詞" },
      { es: "desayunar", ja: "朝食を食べる", note: "" },
      { es: "almorzar", ja: "昼食を食べる", note: "" },
      { es: "cenar", ja: "夕食を食べる", note: "" },
      { es: "trabajar", ja: "働く", note: "" },
      { es: "estudiar", ja: "勉強する", note: "" },
      { es: "descansar", ja: "休む", note: "" },
      { es: "acostarse", ja: "横になる・就寝する", note: "再帰動詞" },
      { es: "dormir", ja: "眠る", note: "" },
      { es: "Me despierto a las siete.", ja: "私は7時に目覚めます。", note: "" },
      { es: "Desayuno a las siete y media.", ja: "7時半に朝食を食べます。", note: "" },
      { es: "Me acuesto a las once.", ja: "11時に就寝します。", note: "" },
      { es: "Me cepillo los dientes antes de dormir.", ja: "寝る前に歯を磨きます。", note: "" },
    ]
  }
];

// Learned tracking per theme: Set of card indices
let learnedSets = [new Set(), new Set(), new Set()];

// ══ STATE ══
let currentTheme = 0;
let currentIndex = 0;
let isFlipped = false;
let showComplete = false;

// ══ INIT ══
function init() {
  renderTabs();
  loadTheme(0);
}

function renderTabs() {
  const el = document.getElementById('themeTabs');
  el.innerHTML = themes.map((t, i) =>
    `<button class="tab ${i===currentTheme?'active':''}" onclick="loadTheme(${i})">${t.name}</button>`
  ).join('');
}

function loadTheme(idx) {
  currentTheme = idx;
  currentIndex = 0;
  isFlipped = false;
  showComplete = false;
  renderTabs();
  renderCard();
  updateProgress();
}

function renderCard() {
  const theme = themes[currentTheme];
  const banner = document.getElementById('completeBanner');
  const scene = document.getElementById('cardScene');
  const answerBtns = document.getElementById('answerBtns');

  if (showComplete || theme.cards.length === 0) {
    banner.classList.add('show');
    scene.style.display = 'none';
    answerBtns.classList.add('hidden');
    if (theme.cards.length === 0) {
      document.getElementById('completeStats').textContent = 'カードがありません。カード編集から追加してください。';
    } else {
      const learned = learnedSets[currentTheme].size;
      document.getElementById('completeStats').textContent =
        `${theme.cards.length}枚中 ${learned}枚 覚えました！\n残り ${theme.cards.length - learned}枚を繰り返し練習しましょう。`;
    }
    document.getElementById('cardCounter').textContent = '';
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
    return;
  }

  banner.classList.remove('show');
  scene.style.display = 'flex';
  answerBtns.classList.remove('hidden');

  const card = theme.cards[currentIndex];
  const wrapper = document.getElementById('cardWrapper');

  // Reset flip without animation flicker
  wrapper.style.transition = 'none';
  wrapper.classList.remove('flipped');
  isFlipped = false;
  void wrapper.offsetWidth;
  wrapper.style.transition = '';

  document.getElementById('cardES').textContent = card.es;
  document.getElementById('cardJA').textContent = card.ja;
  document.getElementById('cardNote').textContent = card.note || '';

  // Learned badge
  const existingBadge = document.querySelectorAll('.learned-badge');
  existingBadge.forEach(b => b.remove());
  if (learnedSets[currentTheme].has(currentIndex)) {
    const badge = document.createElement('span');
    badge.className = 'learned-badge';
    badge.textContent = '覚えた ✓';
    document.getElementById('cardFront').appendChild(badge);
  }

  document.getElementById('cardCounter').textContent = `${currentIndex + 1} / ${theme.cards.length}`;
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').disabled = currentIndex === theme.cards.length - 1;
}

function updateProgress() {
  const theme = themes[currentTheme];
  const total = theme.cards.length;
  const learned = learnedSets[currentTheme].size;
  const pct = total > 0 ? (learned / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${learned} / ${total}`;
}

function flipCard() {
  const wrapper = document.getElementById('cardWrapper');
  isFlipped = !isFlipped;
  wrapper.classList.toggle('flipped', isFlipped);
}

function prevCard() {
  if (currentIndex > 0) { currentIndex--; renderCard(); }
}

function nextCard() {
  const theme = themes[currentTheme];
  if (currentIndex < theme.cards.length - 1) { currentIndex++; renderCard(); }
  else { showComplete = true; renderCard(); }
}

function markCard(knew) {
  if (knew) {
    learnedSets[currentTheme].add(currentIndex);
  } else {
    learnedSets[currentTheme].delete(currentIndex);
  }
  updateProgress();

  // Small delay then next
  setTimeout(() => {
    const theme = themes[currentTheme];
    if (currentIndex < theme.cards.length - 1) {
      currentIndex++;
      renderCard();
    } else {
      showComplete = true;
      renderCard();
    }
  }, 180);
}

function restartTheme() {
  showComplete = false;
  currentIndex = 0;
  renderCard();
  updateProgress();
}

// ══ EXPORT ══
let exportScope = 'all';

function setScope(scope) {
  exportScope = scope;
  document.getElementById('scopeAll').classList.toggle('active', scope === 'all');
  document.getElementById('scopeCurrent').classList.toggle('active', scope === 'current');
}

function getExportThemes() {
  return exportScope === 'all' ? themes : [themes[currentTheme]];
}

function exportCSV() {
  const rows = [['テーマ', 'スペイン語', '日本語', '補足', '学習状況', '出力日時']];
  const now = new Date().toLocaleString('ja-JP');

  getExportThemes().forEach((theme, ti) => {
    const themeIdx = exportScope === 'all' ? ti : currentTheme;
    theme.cards.forEach((card, ci) => {
      const status = learnedSets[themeIdx].has(ci) ? '覚えた' : '未習';
      rows.push([theme.name, card.es, card.ja, card.note || '', status, now]);
    });
  });

  const bom = '\uFEFF'; // UTF-8 BOM for Excel/Sheets compatibility
  const csv = bom + rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
  downloadFile(csv, 'spanish-cards.csv', 'text/csv;charset=utf-8;');
  showToast('CSVを出力しました ✓');
}

function exportJSON() {
  const now = new Date().toLocaleString('ja-JP');
  const data = {
    exportedAt: now,
    themes: getExportThemes().map((theme, ti) => {
      const themeIdx = exportScope === 'all' ? ti : currentTheme;
      return {
        name: theme.name,
        cards: theme.cards.map((card, ci) => ({
          es: card.es,
          ja: card.ja,
          note: card.note || '',
          learned: learnedSets[themeIdx].has(ci)
        }))
      };
    })
  };
  const json = JSON.stringify(data, null, 2);
  downloadFile(json, 'spanish-cards.json', 'application/json');
  showToast('JSONを出力しました ✓');
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ══ MODAL ══
function openModal() {
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

init();
</script>
